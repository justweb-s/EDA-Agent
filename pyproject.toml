[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eda-agent"
version = "0.1.0"
description = "Multi-agent EDA system that generates executed Jupyter notebooks."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["eda", "langgraph", "langchain", "multi-agent", "jupyter"]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "langchain>=0.2.10",
  "langchain-core>=0.2.10",
  "langgraph>=0.2.0",
  "langgraph-checkpoint-sqlite>=0.1.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "tabulate>=0.9",
  "nbformat>=5.10",
  "jupyter_client>=8.6",
  "ipykernel>=6.29",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "prometheus-client>=0.20",
  "tenacity>=8.2",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.1.0"]
anthropic = ["langchain-anthropic>=0.1.0"]
groq = ["langchain-groq>=0.1.0"]
ollama = ["langchain-ollama>=0.1.0"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
  "pre-commit>=3.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["eda_agent*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
